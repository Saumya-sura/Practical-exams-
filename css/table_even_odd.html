<!DOCTYPE html>
<html>
<head>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        /* Header styling */
        th {
            background-color: yellow;
        }

        /* Odd rows */
        tr:nth-child(odd) {
            background-color: red;
        }

        /* Even rows */
        tr:nth-child(even) {
            background-color: blue;
        }

        /* Fix header color (override nth-child) */
        tr:first-child {
            background-color: yellow;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>City</th>
    </tr>
    <tr>
        <td>1</td>
        <td>Saumya</td>
        <td>Mumbai</td>
    </tr>
    <tr>
        <td>2</td>
        <td>Rahul</td>
        <td>Delhi</td>
    </tr>
    <tr>
        <td>3</td>
        <td>Anita</td>
        <td>Pune</td>
    </tr>
    <tr>
        <td>4</td>
        <td>Vikram</td>
        <td>Bangalore</td>
    </tr>
</table>

</body>
</html>
