<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }
        .section {
            margin-bottom: 40px;
        }
        .box {
            width: 220px;
            height: 120px;
            background: #fff;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            border-radius: 8px;
        }
        .box-shadow1 {
            box-shadow: 4px 4px 12px rgba(0,0,0,0.2);
        }
        .box-shadow2 {
            box-shadow: 0 8px 24px 0 rgba(0,0,0,0.3);
        }
        .box-shadow3 {
            box-shadow: inset 0 0 10px #2196f3;
        }
        .text-shadow1 {
            text-shadow: 2px 2px 4px #888;
        }
        .text-shadow2 {
            text-shadow: 0 0 8px #2196f3, 2px 2px 2px #333;
        }
        .text-shadow3 {
            text-shadow: 1px 1px 0 #fff, 2px 2px 0 #2196f3;
        }
    </style>
</head>
<body>
    <h1>CSS Shadows Demo</h1>
    <div class="section">
        <h2>Box Shadow Examples</h2>
        <div class="box box-shadow1">Simple Box Shadow</div>
        <div class="box box-shadow2">Soft Large Shadow</div>
        <div class="box box-shadow3">Inset Blue Shadow</div>
    </div>
    <div class="section">
        <h2>Text Shadow Examples</h2>
        <div class="box" style="background:transparent; box-shadow:none;">
            <span class="text-shadow1">Simple Text Shadow</span>
        </div>
        <div class="box" style="background:transparent; box-shadow:none;">
            <span class="text-shadow2">Multi-layered Text Shadow</span>
        </div>
        <div class="box" style="background:transparent; box-shadow:none;">
            <span class="text-shadow3">Outlined Text Shadow</span>
        </div>
    </div>
</body>
</html>
