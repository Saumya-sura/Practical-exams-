<html>
    
    <script src = "https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
    <script src = "https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular-route.min.js"></script>
<script>
    var app = angular.module("m",["ngRoute"]);
    app.config(function($routeProvider){
        $routeProvider
        .when("/",{
            template: "<h1> home </h1>",
            controller: "myctr"
        })
        .when("/about",{
            templateUrl: "about.html",
                controller: "aboutctr"
        })
        .when("/contact",{
            templateUrl: "contact.html",
                controller: "contactctr"
        })
    });

    app.controller("myctr", function($scope){
        $scope.msg = "Welcome";
    });
    app.controller("aboutctr", function($scope){
        $scope.msg = "This is about page";
    });
    app.controller("contactctr", function($scope){
        $scope.msg = "This is contact page";
        $scope.name = "John Doe";
        $scope.lname = "Smith";
        $scope.submit = function(){
            alert("Hello " + $scope.name + " " + $scope.lname);
        }
    });

</script>
    <body ng-app="m">
        <a href = "#!h"> home </a> <br>
        <a href = "#!about"> about </a>
        <a href = "#!contact"> contact </a>

        <div ng-view></div>

    </body>
