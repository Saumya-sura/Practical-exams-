<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Events Demo</title>
    <style>
        .event-box {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #888;
            width: 300px;
        }
        .output {
            color: #006400;
            font-weight: bold;
        }
    </style>
    <script>
        function showEvent(eventName) {
            document.getElementById('output').innerText = eventName + ' event triggered!';
        }
        function clearOutput() {
            document.getElementById('output').innerText = '';
        }
        window.onload = function() {
            showEvent('onload');
        };
        window.onunload = function() {
            // This may not show in most browsers, but included for completeness
            alert('onunload event triggered!');
        };
    </script>
</head>
<body>
    <h2>JavaScript Events Demo</h2>
    <div class="event-box">
        <strong>onclick:</strong>
        <button onclick="showEvent('onclick')">Click Me</button>
    </div>
    <div class="event-box" onmouseover="showEvent('onmouseover')" onmouseout="showEvent('onmouseout')">
        <strong>onmouseover / onmouseout:</strong>
        <span>Hover over this box</span>
    </div>
    <div class="event-box">
        <strong>onfocus:</strong>
        <input type="text" placeholder="Focus me" onfocus="showEvent('onfocus')" onblur="clearOutput()">
    </div>
    <div class="event-box">
        <strong>onkeypress:</strong>
        <input type="text" placeholder="Type here" onkeypress="showEvent('onkeypress')">
    </div>
    <div class="event-box">
        <strong>onkeydown:</strong>
        <input type="text" placeholder="Press any key" onkeydown="showEvent('onkeydown')">
    </div>
    <div class="event-box">
        <form onsubmit="showEvent('onsubmit'); return false;">
            <strong>onsubmit:</strong>
            <input type="text" placeholder="Submit form">
            <button type="submit">Submit</button>
        </form>
    </div>
    <div id="output" class="output"></div>
</body>
</html>
