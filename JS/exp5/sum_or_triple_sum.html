<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sum or Triple Sum</title>
    <script>
        function computeSum() {
            const num1 = parseInt(document.getElementById('num1').value);
            const num2 = parseInt(document.getElementById('num2').value);
            let result;
            if (num1 === num2) {
                result = 3 * (num1 + num2);
            } else {
                result = num1 + num2;
            }
            document.getElementById('output').textContent = 'Result: ' + result;
        }
    </script>
</head>
<body>
    <h2>Sum or Triple Sum Calculator</h2>
    <label>First Integer: <input type="number" id="num1"></label><br><br>
    <label>Second Integer: <input type="number" id="num2"></label><br><br>
    <button onclick="computeSum()">Compute</button>
    <div id="output" style="margin-top:15px;"></div>
</body>
</html>
