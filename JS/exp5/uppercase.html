<html>
    <body>
        <input type = "text" id="str">
        <button onclick=" Uc()"> Uppercase </button>
        
    </body>
    <script>
        function Uc(){
            let s = document.getElementById("str").value;
            onlyfirst = s.charAt(0).toUpperCase() + s.slice(1);
            document.getElementById("str").value = onlyfirst;
             palindrome = s.split('').reverse().join('');
            if(s === palindrome){
                alert("The string is a palindrome");
            }
            else{
                alert("The string is not a palindrome");
            }
            

        }
    </script>
</html>
