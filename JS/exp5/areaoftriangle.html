<html>
    <body>
        <input type = "text" id ="s1">
        <input type = "text" id ="s2">
        <input type = "text" id ="s3">
        <button onclick=" area()"> Area </button>
        <p id = "result"></p>
    </body>
    <script>
        function area(){
            let a = parseFloat(document.getElementById("s1").value);
            let b = parseFloat(document.getElementById("s2").value);
            let c = parseFloat(document.getElementById("s3").value);
            let s = (a+b+c)/2;
            let area = Math.sqrt(s*(s-a)*(s-b)*(s-c));
            document.getElementById("result").innerHTML = "Area of Triangle is: " + area;
        }
    </script>
</html>
