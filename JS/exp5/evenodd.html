<html>
<head><title>Even Odd Count</title></head>
<body>

<h2>Even and Odd Count</h2>

<form>
Enter Array (comma separated):
<input type="text" id="arr" size="40"><br><br>

<button type="button" onclick="count()">Count</button>
</form>

<p id="out"></p>

<script>
function count(){
    let arr = document.getElementById("arr").value.split(",").map(Number);
    let even=0, odd=0;

    for(let i=0;i<arr.length;i++){
        if(arr[i]%2===0) even++;
        else odd++;
    }

    document.getElementById("out").innerText = 
    "Even Numbers = "+even+" | Odd Numbers = "+odd;
}
</script>

</body>
</html>
