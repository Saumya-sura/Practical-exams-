<html>
<head><title>Largest and Smallest</title></head>
<body>

<h2>Largest and Smallest in Array</h2>

<form>
Enter Array (comma separated): 
<input type="text" id="arr" size="40"><br><br>

<button type="button" onclick="find()">Find</button>
</form>

<p id="out"></p>

<script>
function find(){
    let arr = document.getElementById("arr").value.split(",").map(Number);

    let max = arr[0];
    let min = arr[0];

    for(let i=1;i<arr.length;i++){
        if(arr[i]>max) max=arr[i];
        if(arr[i]<min) min=arr[i];
    }

    document.getElementById("out").innerText = 
    "Largest Number = "+max+" | Smallest Number = "+min;
}
</script>

</body>
</html>
