<html>
<head>
    <title>Season Program</title>
</head>
<body>

<h2>Season Finder (From System Date)</h2>

<p id="date"></p>
<p id="month"></p>
<p id="season"></p>

<script>
let d = new Date();              // current system date
let month = d.getMonth() + 1;   // JS months: 0–11, so +1

let season = "";

// Season logic
if(month==12 || month==1 || month==2){
    season = "Winter";
}
else if(month==3 || month==4 || month==5){
    season = "Summer";
}
else if(month==6 || month==7 || month==8 || month==9){
    season = "Monsoon";
}
else if(month==10 || month==11){
    season = "Autumn";
}

// Output
document.getElementById("date").innerText = "System Date & Time: " + d;
document.getElementById("month").innerText = "Extracted Month Number: " + month;
document.getElementById("season").innerText = "Season: " + season;
</script>

</body>
</html>
