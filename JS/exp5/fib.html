<html>
<head><title>Fibonacci Series</title></head>
<body>

<h2>Fibonacci Series</h2>

<form>
Enter Number of Terms:
<input type="text" id="n"><br><br>

<button type="button" onclick="fib()">Generate</button>
</form>

<p id="out"></p>

<script>
function fib(){
    let n = parseInt(document.getElementById("n").value);
    let a=0,b=1,c;
    let res=[];

    for(let i=1;i<=n;i++){
        res.push(a);
        c=a+b;
        a=b;
        b=c;
    }

    document.getElementById("out").innerText = "Fibonacci Series = " + res.join(", ");
}
</script>

</body>
</html>
