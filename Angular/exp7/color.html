<html>
    <script src =" https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
    <script>
        var app = angular.module("m",[]);
        app.controller("my",function ($scope){
            $scope.color = "red";
        });
    </script>
    <body ng-app="m" ng-controller="my" ng-style = "{'background-color': color}">
        Enter color : <input type="text" ng-model="color">
            <p>
                current color : {{color}}
            </p>
    </body>
</html>
