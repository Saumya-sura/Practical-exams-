 

<!DOCTYPE html> 

<html ng-app="shopApp"> 

<head> 

    <title>Shopping Cart</title> 

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script> 

    <script> 

        var app = angular.module("shopApp", []); 

        app.controller("ShopController", function($scope) { 

            $scope.items = [ 

                {name: "Pen", price: 10}, 

                {name: "Book", price: 50}, 

                {name: "Bag", price: 500} 

            ]; 

            $scope.newItem = ""; 

            $scope.newPrice = ""; 

            $scope.addItem = function() { 

                if($scope.newItem && $scope.newPrice) { 

                    $scope.items.push({ 

                        name: $scope.newItem, 

                        price: $scope.newPrice 

                    }); 

                    $scope.newItem = ""; 

                    $scope.newPrice = ""; 

                } 

            }; 

            $scope.showList = true; 

        }); 

    </script> 

</head> 

<body ng-controller="ShopController" ng-init="enable=true"> 

<h2>Shopping Cart</h2> 

<input type="text" ng-model="newItem" placeholder="Item Name"> 

<input type="number" ng-model="newPrice" placeholder="Price"> 

<button ng-click="addItem()" ng-disabled="!newItem || !newPrice"> 

    Add Item 

</button> 

<br><br> 

<button ng-click="showList = !showList">Show/Hide List</button> 

<ul ng-show="showList"> 

    <li ng-repeat="item in items"> 

        <span ng-bind="item.name"></span> - ₹<span ng-bind="item.price"></span> 

    </li> 

</ul> 

<p ng-hide="items.length">No items in cart</p> 

</body> 

</html>
