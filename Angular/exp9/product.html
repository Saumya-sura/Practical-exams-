<html>
    <script src =" https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
    <script>
        var app = angular.module("m",[]);
        app.service("prodcuts",function(){
            this.price = 50000;

        });
        app.service("cart",function(prodcuts){
            this.total = function(p,q){
                return prodcuts.price*q;
            }
        });
        app.service("discount", function(){
            this.apply = function(total){ 

        return total>1000 ? total*0.9 : total; 

    }; 
        })
        app.controller("my",function ($scope,prodcuts,cart,discount){
            $scope.price = prodcuts.price;
            $scope.total = cart.total(prodcuts,2);
            $scope.final = discount.apply($scope.total);
            
        });
    </script>
    <body ng-app="m" ng-controller="my">
        <p> 
            Product Price : {{price}} <br>
            Total Price for 2 products : {{total}} <br>
            Final Price after discount : {{final}}
        </p>
        </body>
</html>
