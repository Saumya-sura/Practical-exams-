<html>
    <script src =" https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
    <script>
        var app = angular.module("m",[]);
        app.service("Temp",function(){
            this.toF = function(c){
                return (c*9/5)+32;
            }
            this.toK = function(c){
                return c + 273.15;
            }
        });
        app.controller("my",function($scope,Temp){

            $scope.c = 25;
            $scope.f = Temp.toF($scope.c);
            $scope.k = Temp.toK($scope.c);

 
        });
    </script>
    <body ng-app="m" ng-controller="my">
        <p> 
            Temperature in Celsius : {{c}} <br>
            Temperature in Fahrenheit : {{f}} <br>
            Temperature in Kelvin : {{k}}
        </p>
        </body>

</html>
