<html>
    <script src =" https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
    <script>
        var app = angular.module("m",[]);
        app.factory("Intrest", function(){
            return {
                calc:  function(p,r,t){
                return (p*r*t)/100;
                }
            }
        });
        app.controller("my",function($scope,Intrest){


            $scope.si = Intrest.calc(10000,10,2);
 
        });
    </script>
    <body ng-app="m" ng-controller="my">
        <p> 
            {{si}}
        </p>
        </body>

</html>
